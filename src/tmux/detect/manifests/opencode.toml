id = "opencode"

[[rules]]
extends = "interrupt_hint"
id = "interrupt_hint"
priority = 970
# "esc again to interrupt" is the footer after one Esc press, in 1.x and 2.x.
contains_any = ["esc to interrupt", "esc interrupt", "esc again to interrupt"]

[[rules]]
extends = "spinner"
id = "spinner"
priority = 960

# Standalone: the shared `approve`/`allow` substrings match prose like "the
# approved plan", so only the dialog's own phrasing counts.
[[rules]]
id = "approval_prompt"
state = "waiting"
priority = 950
region = "whole_recent"
visible = true
contains_any = ["(y/n)", "[y/n]", "continue?", "proceed?", "enter to select", "esc to cancel"]

# The permission dialog's option row, which prose does not reproduce: 1.x
# labels the middle option "Allow always", 2.x "Always allow", and some
# dialogs offer no grant at all. Ranks above the spinner and interrupt rules
# because the dialog is drawn while the tool row's spinner still turns.
[[rules]]
id = "permission_dialog"
state = "waiting"
priority = 980
region = "whole_recent"
visible = true
any = [
  { line_regex = ['(?i)allow once\s+(?:allow always|always allow|reject)'] },
  { line_regex = ['\x{25B3}\s*(?:Permission required|Always allow)'] },
]

# The question tool's list: numbered rows with no selection marker, so only
# its key hints identify it.
[[rules]]
id = "question_dialog"
state = "waiting"
priority = 980
region = "whole_recent"
visible = true
line_regex = ['(?i)enter submit\s+esc dismiss']

# A numbered menu row carrying the selection cursor.
[[rules]]
id = "numbered_choice"
state = "waiting"
priority = 940
region = "whole_recent"
visible = true
line_regex = ['(?i)\x{276F}(?:\s*|.* )[123]\.']

# Parked at the input prompt.
[[rules]]
extends = "input_prompt"
id = "input_prompt"
priority = 930
# opencode also parks on a doubled prompt.
any = [{ line_regex = ['(?i)^\s*>>\s*$'] }]
